<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>春节倒计时 · 2027</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html {
    touch-action: manipulation;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at 50% 30%, #c0392b 0%, #8B0000 45%, #4a0000 100%);
    background-attachment: fixed;
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    overflow-x: hidden;
    position: relative;
    padding: 24px 0;
    -webkit-user-select: none;
    user-select: none;
  }

  #fx {
    position: fixed;
    inset: 0;
    z-index: 10;
    pointer-events: none;
  }

  /* ===== 弹幕层 ===== */
  #danmaku {
    position: fixed;
    inset: 0;
    z-index: 5;
    pointer-events: none;
    overflow: hidden;
  }

  .danmaku-item {
    position: absolute;
    left: 100%;
    white-space: nowrap;
    font-size: 15px;
    letter-spacing: 1.5px;
    color: rgba(255, 240, 200, 0.82);
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
    padding: 4px 14px;
    border-radius: 999px;
    background: rgba(0, 0, 0, 0.16);
    border: 1px solid rgba(245, 197, 66, 0.18);
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
    will-change: transform;
    animation-name: danmaku-move;
    animation-timing-function: linear;
    animation-fill-mode: forwards;
  }

  @keyframes danmaku-move {
    from { transform: translateX(0); }
    to   { transform: translateX(calc(-100vw - 100%)); }
  }

  /* ===== 摇摆灯笼 ===== */
  .lantern {
    position: absolute;
    top: -10px;
    width: 58px;
    height: 46px;
    background: linear-gradient(180deg, #e63946, #b71c1c);
    border-radius: 50% 50% 45% 45%;
    box-shadow: 0 8px 20px rgba(0,0,0,.35), inset 0 -6px 12px rgba(0,0,0,.25);
    opacity: .9;
    z-index: 2;
    transform-origin: 50% -18px;
    animation: sway 3.4s ease-in-out infinite alternate;
  }
  .lantern::before {
    content: "";
    position: absolute;
    top: -18px;
    left: 50%;
    transform: translateX(-50%);
    width: 2px;
    height: 18px;
    background: #f5c542;
  }
  .lantern::after {
    content: "";
    position: absolute;
    bottom: -22px;
    left: 50%;
    transform: translateX(-50%);
    width: 6px;
    height: 22px;
    background: #f5c542;
    border-radius: 0 0 3px 3px;
  }
  .lantern.l1 { left: 11%; }
  .lantern.l2 { right: 11%; animation-delay: -1.7s; }

  @keyframes sway {
    from { transform: rotate(-7deg); }
    to   { transform: rotate(7deg); }
  }

  /* ===== 主卡片 ===== */
  .card {
    position: relative;
    z-index: 3;
    text-align: center;
    padding: 46px 44px 34px;
    border-radius: 30px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(245, 197, 66, 0.18);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
    max-width: 920px;
    width: calc(100% - 40px);
  }

  .subtitle {
    font-size: 14px;
    letter-spacing: 6px;
    color: rgba(245, 197, 66, 0.7);
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  h1 {
    font-size: clamp(28px, 4vw, 42px);
    font-weight: 800;
    letter-spacing: 10px;
    margin-bottom: 30px;
    background: linear-gradient(100deg, #d9a520 0%, #f5c542 25%, #fff6d5 50%, #f5c542 75%, #d9a520 100%);
    background-size: 220% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shine 5s linear infinite;
    filter: drop-shadow(0 4px 18px rgba(245, 197, 66, 0.3));
  }

  @keyframes shine {
    to { background-position: 220% center; }
  }

  /* ===== 倒计时 ===== */
  .countdown {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .unit {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 88px;
  }

  .num {
    display: inline-block;
    font-size: clamp(48px, 8vw, 86px);
    font-weight: 800;
    line-height: 1;
    color: #fff8e7;
    font-variant-numeric: tabular-nums;
    letter-spacing: 2px;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-shadow:
      0 0 10px rgba(255, 210, 90, 0.35),
      0 2px 4px rgba(0, 0, 0, 0.8);
    will-change: transform;
  }

  .num.bump {
    animation: bump 0.38s cubic-bezier(.34, 1.56, .64, 1);
  }

  @keyframes bump {
    0%   { transform: scale(1); color: #fff8e7; }
    45%  { transform: scale(1.14); color: #ffe9a8; }
    100% { transform: scale(1); color: #fff8e7; }
  }

  .label {
    margin-top: 12px;
    font-size: 13px;
    letter-spacing: 4px;
    color: rgba(255, 248, 231, 0.55);
  }

  .sep {
    font-size: clamp(40px, 6vw, 68px);
    font-weight: 300;
    color: rgba(245, 197, 66, 0.35);
    line-height: 1;
    margin-top: 4px;
    user-select: none;
  }

  .target-date {
    margin-top: 26px;
    font-size: 14px;
    color: rgba(255, 248, 231, 0.4);
    letter-spacing: 3px;
  }

  .target-date strong {
    color: rgba(245, 197, 66, 0.75);
    font-weight: 600;
  }

  /* =========================================================
     盲盒抽签模块
     ========================================================= */
  .fortune {
    margin-top: 30px;
    padding-top: 24px;
    border-top: 1px dashed rgba(245, 197, 66, 0.22);
  }

  .fortune-title {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-size: 12px;
    letter-spacing: 3px;
    color: rgba(245, 197, 66, 0.7);
    margin-bottom: 16px;
    font-family: "Consolas", "SF Mono", monospace;
  }

  .box-wrap {
    perspective: 1200px;
    max-width: 460px;
    margin: 0 auto;
  }

  .box {
    position: relative;
    width: 100%;
    min-height: 188px;
    transform-style: preserve-3d;
    transition: transform 0.75s cubic-bezier(.2, .9, .3, 1.1);
    cursor: pointer;
  }

  .box.flipped {
    transform: rotateY(180deg);
  }

  .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 18px 18px 16px;
    overflow: hidden;
  }

  .face-front {
    justify-content: center;
    background: linear-gradient(160deg, rgba(245,197,66,0.12), rgba(183,28,28,0.22));
    border: 1px solid rgba(245, 197, 66, 0.35);
    box-shadow: inset 0 0 30px rgba(245, 197, 66, 0.08);
  }

  .face-front .gift {
    font-size: 42px;
    margin-bottom: 8px;
    animation: float-gift 2.4s ease-in-out infinite;
  }

  @keyframes float-gift {
    0%, 100% { transform: translateY(0) rotate(-4deg); }
    50%      { transform: translateY(-8px) rotate(4deg); }
  }

  .face-front .hint {
    font-size: 13px;
    letter-spacing: 3px;
    color: rgba(255, 240, 200, 0.75);
    margin-bottom: 14px;
  }

  .draw-btn {
    font-size: 13px;
    letter-spacing: 3px;
    padding: 9px 28px;
    border-radius: 999px;
    border: 1px solid rgba(245, 197, 66, 0.6);
    background: linear-gradient(180deg, rgba(245,197,66,0.25), rgba(245,197,66,0.1));
    color: #ffe9a8;
    cursor: pointer;
    transition: all 0.2s ease;
    font-family: inherit;
    flex-shrink: 0;
  }

  .draw-btn:hover {
    background: linear-gradient(180deg, rgba(245,197,66,0.45), rgba(245,197,66,0.2));
    box-shadow: 0 0 18px rgba(245, 197, 66, 0.35);
  }

  .draw-btn:active {
    transform: scale(0.95);
  }

  .face-back {
    transform: rotateY(180deg);
    background: linear-gradient(160deg, rgba(255, 248, 231, 0.1), rgba(183,28,28,0.28));
    border: 1px solid rgba(245, 197, 66, 0.45);
    box-shadow: inset 0 0 40px rgba(245, 197, 66, 0.1);
  }

  .fortune-body {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 1 1 auto;
    min-height: 0;
    justify-content: center;
  }

  .fortune-level {
    font-size: 11px;
    letter-spacing: 4px;
    color: #f5c542;
    padding: 3px 14px;
    border: 1px solid rgba(245, 197, 66, 0.4);
    border-radius: 999px;
    margin-bottom: 8px;
    flex-shrink: 0;
  }

  .fortune-text {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 3px;
    color: #fff4d6;
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
    margin-bottom: 4px;
    line-height: 1.4;
    text-align: center;
  }

  .fortune-sub {
    font-size: 11px;
    letter-spacing: 1.5px;
    color: rgba(255, 240, 200, 0.6);
    margin-bottom: 10px;
    line-height: 1.4;
    text-align: center;
  }

  .fortune-stats {
    display: flex;
    gap: 6px;
    width: 100%;
    margin-bottom: 12px;
    flex-shrink: 0;
  }

  .stat {
    flex: 1;
    padding: 6px 4px;
    border-radius: 10px;
    background: rgba(0, 0, 0, 0.18);
    border: 1px solid rgba(245, 197, 66, 0.16);
    min-width: 0;
  }

  .stat .k {
    display: block;
    font-size: 9px;
    letter-spacing: 1px;
    color: rgba(245, 197, 66, 0.6);
    margin-bottom: 3px;
  }

  .stat .v {
    display: block;
    font-size: 13px;
    font-weight: 700;
    color: #ffe9a8;
    letter-spacing: 1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .draw-again {
    font-size: 11px;
    letter-spacing: 2px;
    padding: 6px 18px;
    border-radius: 999px;
    border: 1px solid rgba(245, 197, 66, 0.4);
    background: rgba(245, 197, 66, 0.1);
    color: rgba(255, 233, 168, 0.9);
    cursor: pointer;
    transition: all 0.2s ease;
    font-family: inherit;
    flex-shrink: 0;
    margin-top: 4px;
  }

  .draw-again:hover {
    background: rgba(245, 197, 66, 0.25);
  }

  .unlocked {
    margin-top: 18px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
    min-height: 24px;
  }

  .unlocked .u-badge {
    font-size: 10px;
    letter-spacing: 1px;
    padding: 4px 10px;
    border-radius: 999px;
    color: #ffe9a8;
    background: rgba(245, 197, 66, 0.14);
    border: 1px solid rgba(245, 197, 66, 0.35);
    animation: pop-in 0.35s cubic-bezier(.34, 1.56, .64, 1);
  }

  @keyframes pop-in {
    from { transform: scale(0.5); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }

  .footer-egg {
    margin-top: 20px;
    font-size: 11px;
    letter-spacing: 2px;
    color: rgba(255, 248, 231, 0.28);
    text-align: center;
  }

  .footer-egg .heart {
    color: rgba(230, 57, 70, 0.7);
    display: inline-block;
    animation: heartbeat 1.4s ease-in-out infinite;
  }

  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.25); }
  }

  .celebrate {
    font-size: clamp(28px, 4vw, 40px);
    color: #f5c542;
    font-weight: 700;
    letter-spacing: 6px;
    padding: 40px 0;
  }

  /* ===== 平板 / 小屏 ===== */
  @media (max-width: 640px) {
    .card { padding: 34px 16px 28px; }
    h1 { letter-spacing: 6px; margin-bottom: 24px; }
    .unit { min-width: 62px; }
    .countdown { gap: 4px; }
    .lantern { width: 42px; height: 34px; }
    .lantern.l1 { left: 4%; }
    .lantern.l2 { right: 4%; }
    .danmaku-item { font-size: 13px; padding: 3px 11px; }
    .fortune { margin-top: 24px; padding-top: 20px; }
    .box { min-height: 176px; }
  }

  /* ===== 窄屏手机 ===== */
  @media (max-width: 420px) {
    .countdown {
      flex-wrap: nowrap;
      gap: 2px;
    }
    .unit {
      min-width: 0;
      flex: 1 1 0;
    }
    .num {
      font-size: clamp(30px, 12vw, 48px);
      letter-spacing: 0;
    }
    .sep {
      font-size: clamp(24px, 8vw, 40px);
      margin-top: 0.08em;
    }
    .label {
      font-size: 10px;
      letter-spacing: 1px;
      margin-top: 6px;
    }
    .card {
      padding: 26px 10px 22px;
      border-radius: 22px;
    }
    .subtitle {
      font-size: 11px;
      letter-spacing: 3px;
    }
    .target-date {
      font-size: 12px;
      letter-spacing: 1px;
      margin-top: 20px;
    }
    .danmaku-item { font-size: 12px; padding: 3px 10px; }

    .box { min-height: 174px; }
    .face { padding: 14px 12px 12px; }
    .fortune-level { font-size: 10px; padding: 2px 10px; margin-bottom: 6px; }
    .fortune-text { font-size: 14px; letter-spacing: 2px; margin-bottom: 3px; }
    .fortune-sub { font-size: 9px; letter-spacing: 1px; margin-bottom: 8px; }
    .fortune-stats { gap: 5px; margin-bottom: 10px; }
    .stat { padding: 5px 2px; }
    .stat .k { font-size: 8px; }
    .stat .v { font-size: 11px; }
    .draw-again { font-size: 10px; padding: 5px 14px; }

    .footer-egg { font-size: 10px; letter-spacing: 1px; }
  }
</style>
</head>
<body>

<canvas id="fx"></canvas>
<div id="danmaku"></div>

<div class="lantern l1"></div>
<div class="lantern l2"></div>

<div class="card">
  <div class="subtitle">Spring Festival Countdown</div>
  <h1>春节倒计时</h1>

  <div id="countdown" class="countdown">
    <div class="unit"><span class="num" id="d">00</span><span class="label">天</span></div>
    <span class="sep">:</span>
    <div class="unit"><span class="num" id="h">00</span><span class="label">时</span></div>
    <span class="sep">:</span>
    <div class="unit"><span class="num" id="m">00</span><span class="label">分</span></div>
    <span class="sep">:</span>
    <div class="unit"><span class="num" id="s">00</span><span class="label">秒</span></div>
  </div>

  <div id="celebrate" class="celebrate" style="display:none;">🎉 春节快乐 🎉</div>

  <div class="target-date">目标：<strong>2027 年 2 月 6 日（正月初一）</strong></div>

  <div class="fortune">
    <div class="fortune-title">🧧 春节盲盒 · 抽一签</div>

    <div class="box-wrap">
      <div class="box" id="box">
        <div class="face face-front">
          <div class="gift">🎁</div>
          <div class="hint">今天的运势盲盒</div>
          <button class="draw-btn" id="drawBtn">抽 一 签</button>
        </div>

        <div class="face face-back">
          <div class="fortune-body">
            <div class="fortune-level" id="fLevel">上上签</div>
            <div class="fortune-text" id="fText">所求皆如愿</div>
            <div class="fortune-sub" id="fSub">愿你新的一年，所行化坦途</div>
            <div class="fortune-stats">
              <div class="stat"><span class="k">幸运色</span><span class="v" id="fColor">中国红</span></div>
              <div class="stat"><span class="k">幸运数</span><span class="v" id="fNum">8</span></div>
              <div class="stat"><span class="k">宜</span><span class="v" id="fGood">团圆</span></div>
            </div>
          </div>
          <button class="draw-again" id="againBtn">再抽一次 ↻</button>
        </div>
      </div>
    </div>

    <div class="unlocked" id="unlocked"></div>

    <div class="footer-egg">
      用 <span class="heart">♥</span> 写的倒计时 · 记得早点回家
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* =========================================================
     1. 倒计时
     ========================================================= */
  var TARGET = new Date(2027, 1, 6, 0, 0, 0).getTime();

  var els = {
    d: document.getElementById('d'),
    h: document.getElementById('h'),
    m: document.getElementById('m'),
    s: document.getElementById('s')
  };
  var countdownEl = document.getElementById('countdown');
  var celebrateEl = document.getElementById('celebrate');

  function pad(n) {
    return n < 10 ? '0' + n : '' + n;
  }

  function setNum(el, val) {
    var str = pad(val);
    if (el.textContent !== str) {
      el.textContent = str;
      el.classList.remove('bump');
      void el.offsetWidth;
      el.classList.add('bump');
    }
  }

  function tick() {
    var diff = TARGET - Date.now();

    if (diff <= 0) {
      countdownEl.style.display = 'none';
      celebrateEl.style.display = 'block';
      return;
    }

    var total = Math.floor(diff / 1000);
    setNum(els.d, Math.floor(total / 86400));
    setNum(els.h, Math.floor((total % 86400) / 3600));
    setNum(els.m, Math.floor((total % 3600) / 60));
    setNum(els.s, total % 60);
  }

  tick();
  setInterval(tick, 250);

  /* =========================================================
     2. 弹幕：三行，随机间隔，修复同轨重叠
     ========================================================= */
  var TIPS = [
    '🧧 红包准备好了吗？',
    '🥟 江磊枫已买下此广告位并祝大家新年快乐',
    '🎫 回家的车票抢到了吗？',
    '🏮 春联和福字写好了吗？',
    '🍊 年货该囤起来啦！',
    '🐑 2027 丁未羊年 · 祝你“羊”眉吐气',
    '🎆 记得给自己许个新年愿望',
    '🎆 帮忙签一下SRC啊喂',
    '🧨 鞭炮声声辞旧岁，岁岁平安',
    '🍬 糖果瓜子备齐了没？',
    '👨‍👩‍👧 今年回家陪爸妈吃顿饭吧',
    '🧧 压岁钱记得留一点给自己',
    '🥢 团圆饭的筷子摆好了吗？',
    '🎊 新年新气象，万事顺遂',
    '🍜 除夕那碗面别煮太软',
    '✨ lot快快跑，机台快快run'
  ];

  var layer = document.getElementById('danmaku');
  var tipIdx = 0;

  var ROW_COUNT  = 3;
  var ROW_HEIGHT = 40;
  var BASE_SPEED = 120;      // px/s
  var LANE_BUFFER = 150;     // 轨道额外缓冲，毫秒

  var laneFreeAt = new Array(ROW_COUNT).fill(0);

  // 修复点 1：全忙时返回 -1，不再强行选最早释放的轨道
  function pickLane() {
    var now = Date.now();
    for (var i = 0; i < ROW_COUNT; i++) {
      if (laneFreeAt[i] <= now) return i;
    }
    return -1;
  }

  // 修复点 2：用“完全离屏时间 + 缓冲”占用轨道，并返回是否发射成功
  function fireDanmaku() {
    var lane = pickLane();
    if (lane === -1) return false;   // 没空位，本次跳过

    var text = TIPS[tipIdx];
    tipIdx = (tipIdx + 1) % TIPS.length;

    var item = document.createElement('div');
    item.className = 'danmaku-item';
    item.textContent = text;

    var h = window.innerHeight;
    var startY = Math.max(80, h * 0.16);
    item.style.top = (startY + lane * ROW_HEIGHT) + 'px';

    layer.appendChild(item);
    var width = item.offsetWidth;

    // 动画时长：从左侧 100% 移到完全离屏，总路程 = 视口宽 + 自身宽
    var distance = window.innerWidth + width;
    var duration = distance / BASE_SPEED;
    item.style.animationDuration = duration.toFixed(2) + 's';

    // 轨道占用 = 这条弹幕完全离开屏幕所需时间 + 缓冲
    var leaveTime = distance / BASE_SPEED * 500;
    laneFreeAt[lane] = Date.now() + leaveTime + LANE_BUFFER;

    item.addEventListener('animationend', function () { item.remove(); });
    return true;
  }

  // 修复点 3：成功时随机间隔 700~1500ms，失败时 200ms 后快速重试
  function scheduleNext() {
    var ok = fireDanmaku();
    var delay = ok ? (400 + Math.random() * 400) : 200;
    setTimeout(scheduleNext, delay);
  }

  setTimeout(scheduleNext, 500);

  /* =========================================================
     3. 春节盲盒抽签
     ========================================================= */
  var FORTUNES = [
    { level: '上上签', text: '所求皆如愿', sub: '愿你新的一年，所行化坦途', color: '中国红', num: '8', good: '团圆' },
    { level: '上上签', text: '岁岁常欢愉', sub: '年年有今日，岁岁有今朝', color: '鎏金', num: '6', good: '聚餐' },
    { level: '上吉签', text: '万事皆顺遂', sub: '心之所向，行之所往', color: '朱红', num: '9', good: '出行' },
    { level: '上吉签', text: '喜乐长安宁', sub: '愿你所遇皆温柔', color: '琥珀', num: '3', good: '见友' },
    { level: '中吉签', text: '花开富贵来', sub: '静待花开，自有好景', color: '暖橙', num: '5', good: '置办年货' },
    { level: '中吉签', text: '平安即福气', sub: '无病无灾，便是上上签', color: '米白', num: '1', good: '早睡' },
    { level: '中吉签', text: '前路有微光', sub: '慢慢走，总会到达', color: '浅金', num: '7', good: '散步' },
    { level: '小吉签', text: '宜静待时机', sub: '不着急，好饭不怕晚', color: '墨绿', num: '2', good: '读书' },
    { level: '小吉签', text: '细水长流年', sub: '平淡里也藏着甜', color: '天青', num: '4', good: '喝茶' },
    { level: '上上签', text: '财源滚滚来', sub: '红包鼓鼓，钱包满满', color: '正红', num: '88', good: '收红包' },
    { level: '上吉签', text: '学业步步高', sub: '笔下生花，考运亨通', color: '靛蓝', num: '10', good: '学习' },
    { level: '中吉签', text: '有缘自相逢', sub: '想见的人，终会见到', color: '桃粉', num: '11', good: '联系老友' }
  ];

  var boxEl      = document.getElementById('box');
  var drawBtn    = document.getElementById('drawBtn');
  var againBtn   = document.getElementById('againBtn');
  var fLevel     = document.getElementById('fLevel');
  var fText      = document.getElementById('fText');
  var fSub       = document.getElementById('fSub');
  var fColor     = document.getElementById('fColor');
  var fNum       = document.getElementById('fNum');
  var fGood      = document.getElementById('fGood');
  var unlockedEl = document.getElementById('unlocked');

  var unlocked  = {};
  var lastIndex = -1;
  var flipping  = false;

  // 盒子高度随内容自适应，保证按钮不溢出
  function syncBoxHeight() {
    var front = boxEl.querySelector('.face-front');
    var back  = boxEl.querySelector('.face-back');

    function measure(el) {
      var prevPos = el.style.position;
      var prevVis = el.style.visibility;
      el.style.position = 'relative';
      el.style.visibility = 'hidden';
      var hgt = el.scrollHeight;
      el.style.position = prevPos;
      el.style.visibility = prevVis;
      return hgt;
    }

    var h1 = measure(front);
    var h2 = measure(back);
    var maxH = Math.max(h1, h2, 188);
    boxEl.style.minHeight = maxH + 'px';
  }

  function drawFortune() {
    if (flipping) return;
    flipping = true;

    var idx;
    do { idx = Math.floor(Math.random() * FORTUNES.length); }
    while (idx === lastIndex && FORTUNES.length > 1);
    lastIndex = idx;

    var f = FORTUNES[idx];
    boxEl.classList.remove('flipped');

    setTimeout(function () {
      fLevel.textContent = f.level;
      fText.textContent  = f.text;
      fSub.textContent   = f.sub;
      fColor.textContent = f.color;
      fNum.textContent   = f.num;
      fGood.textContent  = f.good;

      syncBoxHeight();
      boxEl.classList.add('flipped');

      if (!unlocked[f.text]) {
        unlocked[f.text] = true;
        var b = document.createElement('span');
        b.className = 'u-badge';
        b.textContent = '✦ ' + f.text;
        unlockedEl.appendChild(b);
      }

      var rect = boxEl.getBoundingClientRect();
      if (typeof boom === 'function') {
        boom(rect.left + rect.width / 2, rect.top + rect.height / 2);
      }

      setTimeout(function () { flipping = false; }, 450);
    }, 380);
  }

  drawBtn.addEventListener('click',  function (e) { e.stopPropagation(); drawFortune(); });
  againBtn.addEventListener('click', function (e) { e.stopPropagation(); drawFortune(); });
  boxEl.addEventListener('click',    function (e) { e.stopPropagation(); drawFortune(); });

  window.addEventListener('load', syncBoxHeight);
  window.addEventListener('resize', syncBoxHeight);

  /* =========================================================
     4. Canvas 特效
     ========================================================= */
  var canvas = document.getElementById('fx');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width  = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  var petals = [];
  function makePetal(initial) {
    return {
      x: Math.random() * W,
      y: initial ? Math.random() * H : -30,
      size: 3 + Math.random() * 5,
      vy: 0.35 + Math.random() * 0.75,
      vx: -0.35 + Math.random() * 0.7,
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - 0.5) * 0.04,
      alpha: 0.22 + Math.random() * 0.42,
      gold: Math.random() < 0.55
    };
  }
  for (var i = 0; i < 34; i++) petals.push(makePetal(true));

  var sparks = [];
  function boom(x, y) {
    if (sparks.length > 700) return;
    var count = 46 + Math.floor(Math.random() * 24);
    var hue = Math.random() * 360;
    for (var i = 0; i < count; i++) {
      var angle = Math.random() * Math.PI * 2;
      var speed = 1.2 + Math.random() * 5.5;
      sparks.push({
        x: x, y: y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1,
        decay: 0.012 + Math.random() * 0.022,
        size: 1 + Math.random() * 2.2,
        color: 'hsl(' + Math.floor(hue + Math.random() * 70) + ',100%,' +
               Math.floor(58 + Math.random() * 22) + '%)'
      });
    }
  }

  var words = [];
  var WORD_POOL = ['福', '🧧', '🎉', '🐑', '🧨', '🥟', '🏮', '💰', '🍊', '✨', '喜', '春'];
  function floatWord(x, y) {
    words.push({
      x: x + (Math.random() - 0.5) * 40,
      y: y,
      text: WORD_POOL[Math.floor(Math.random() * WORD_POOL.length)],
      vy: -(0.9 + Math.random() * 0.8),
      life: 1,
      size: 18 + Math.random() * 18
    });
  }

  var downX = 0, downY = 0, downT = 0;
  window.addEventListener('pointerdown', function (e) {
    downX = e.clientX; downY = e.clientY; downT = Date.now();
  });
  window.addEventListener('pointerup', function (e) {
    var dx = Math.abs(e.clientX - downX);
    var dy = Math.abs(e.clientY - downY);
    if (dx < 10 && dy < 10 && Date.now() - downT < 350) {
      boom(e.clientX, e.clientY);
      floatWord(e.clientX, e.clientY);
    }
  });

  function loop() {
    ctx.clearRect(0, 0, W, H);

    for (var i = 0; i < petals.length; i++) {
      var p = petals[i];
      p.y += p.vy;
      p.x += p.vx + Math.sin((p.y + p.rot * 40) * 0.01) * 0.35;
      p.rot += p.vr;
      if (p.y > H + 40 || p.x < -50 || p.x > W + 50) {
        petals[i] = makePetal(false);
        continue;
      }
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.globalAlpha = p.alpha;
      ctx.fillStyle = p.gold ? '#f5c542' : '#e8563f';
      ctx.beginPath();
      ctx.ellipse(0, 0, p.size, p.size * 0.55, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    ctx.globalCompositeOperation = 'lighter';
    for (var j = sparks.length - 1; j >= 0; j--) {
      var s = sparks[j];
      s.x += s.vx; s.y += s.vy;
      s.vx *= 0.982;
      s.vy = s.vy * 0.982 + 0.055;
      s.life -= s.decay;
      if (s.life <= 0) { sparks.splice(j, 1); continue; }
      ctx.globalAlpha = Math.max(s.life, 0);
      ctx.fillStyle = s.color;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.size * (0.4 + s.life * 0.6), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';

    for (var k = words.length - 1; k >= 0; k--) {
      var w = words[k];
      w.y += w.vy;
      w.life -= 0.011;
      if (w.life <= 0) { words.splice(k, 1); continue; }
      ctx.globalAlpha = Math.min(w.life, 1);
      ctx.font = '700 ' + w.size + 'px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#ffd75e';
      ctx.shadowColor = 'rgba(255, 180, 40, 0.9)';
      ctx.shadowBlur = 16;
      ctx.fillText(w.text, w.x, w.y);
      ctx.shadowBlur = 0;
    }

    ctx.globalAlpha = 1;
    requestAnimationFrame(loop);
  }
  loop();

  setTimeout(function () {
    boom(W * 0.28, H * 0.3);
    boom(W * 0.72, H * 0.24);
  }, 500);

})();
</script>
